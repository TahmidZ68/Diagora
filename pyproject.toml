[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "diagora-cli"
version = "0.1.0a3"
description = "Open-source developer diagnostics and root-cause intelligence CLI for Python, Node.js, Docker, and deployments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Diagora Contributors" }
]
keywords = [
    "diagnostics",
    "developer-tools",
    "cli",
    "root-cause-analysis",
    "python",
    "nodejs",
    "docker",
    "devops"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
diagora = "diagora.cli:main"

[project.urls]
Homepage = "https://github.com/TahmidZ68/Diagora"
Repository = "https://github.com/TahmidZ68/Diagora"
Documentation = "https://github.com/TahmidZ68/Diagora/tree/main/docs"
Issues = "https://github.com/TahmidZ68/Diagora/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/diagora"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/CHANGELOG.md",
    "/.editorconfig",
    "/.gitattributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/golden/snapshots"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["diagora"]

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
