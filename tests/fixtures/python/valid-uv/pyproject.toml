[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "uv-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]

[project.scripts]
uv-demo = "uvapp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
managed = true
