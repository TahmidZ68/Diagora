name: Diagora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff formatter and linter checks
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Run strict Mypy type checking
        run: mypy src

      - name: Run unit, integration, golden, and security tests
        run: pytest -v --cov=diagora --cov-report=term-missing

      - name: Build sdist and wheel packages
        run: python -m build

      - name: Smoke test clean wheel installation in isolated venv
        shell: bash
        run: |
          python -m venv .smoke-venv
          if [ -x ".smoke-venv/Scripts/python.exe" ]; then
            VENV_PY=".smoke-venv/Scripts/python.exe"
            VENV_CLI=".smoke-venv/Scripts/diagora.exe"
          else
            VENV_PY=".smoke-venv/bin/python"
            VENV_CLI=".smoke-venv/bin/diagora"
          fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install dist/*.whl
          "$VENV_CLI" --version
          "$VENV_CLI" --help
          "$VENV_CLI" rules list --status implemented
          "$VENV_CLI" doctor .
          "$VENV_CLI" scan tests/fixtures/python/valid-uv --format json
          "$VENV_CLI" scan tests/fixtures/node/valid-workspace --format json
          "$VENV_CLI" scan tests/fixtures/mixed/monorepo --format json

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime package and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit

      - name: Run pip-audit on runtime environment
        run: pip-audit --strict
